<!DOCTYPE html>
<html>
<html lang="sk">

<head>

<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
<div>
    <!-- Plávajúci box (tooltip), predvolene skrytý -->
<div id="path-tooltip" style="
  display: none;
  position: absolute;
  z-index: 999;
  border: 1px solid #ccc; 
  padding: 12px; 
  border-radius: 8px; 
  background-color: rgba(249, 249, 249, 0.95); 
  box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
  font-family: monospace; 
  font-size: 12px;
  max-width: 280px;
  pointer-events: none; /* Aby myš ignorovala box a neblikala pri pohybe */
">
</div>
    <div style="display: flex;">
        <div><h1></h1> </div>
        <button onclick="nextStep()" style="display: none;">Ďalší Krok</button>
        <button id="codemode" onclick="codeView()"style="display: none;">Mód pozerania kodu</button>
        <button onclick="beforeStep()"style="display: none;">Krok späť</button>
        <input id="gotoLineInput" type="number" min="1" placeholder="riadok kodu" style="width: 80px; display: none;"/>
        <button onclick="goToLine()" style="display: none;">Riadok</button>
        <span id="cy-perspective-controls">
        <label>
        <input type="radio" name="cyPerspective" value="graph" checked>
        Cesty
        </label>
        <label>
        <input type="radio" name="cyPerspective" value="edge">
        Hrany
        </label>
        </span>
    </div>
    <div>
        <div class="editor">
        <div class="line-numbers" id="lines"></div>
        <div class="code" id="code"></div>
        <div class="cursor" id="cursor">➤</div>
    </div>

</div>

</div>


    <div>
        <div id="playback-workspace" class="workspace is-hidden">
            <div class="workspace-item">
                <h2 class="workspace-label">Cieľ</h2>
                <div id="playback-target" class="workspace-box"></div>
            </div>
        </div>

        <div id="cy" style="width: 60vh; height: 40vh; margin-left: 10vh;margin-right: 20vh; border: 1vh solid #ccc;"></div>
        <div class="graph-actions">
        <button onclick="showName()">Nový graf</button>

        <button onclick="askForVertices(getdistance)">Vzdialenosť</button>

        <button onclick="askForVertices(getpath)">Cesta</button>
        <button type="button" onclick="openUpdateDialog()">Update</button>
        <p class="graph-edge-hint">Alebo zadajte hranu kliknutím na dva vrcholy v grafe (najprv zdrojový, potom cieľový).</p>
        </div>
        <dialog id="vertex-dialog" class="vertex-dialog" aria-labelledby="vertex-dialog-title">
            <form id="vertex-form" class="vertex-form" novalidate>
                <div class="vertex-dialog-heading">
                    <div>
                        <p class="vertex-dialog-kicker">DOTAZ NA GRAF</p>
                        <h2 id="vertex-dialog-title">Vzdialenosť</h2>
                    </div>
                    <button type="button" id="vertex-dialog-close" class="vertex-dialog-close" aria-label="Zavrieť">&times;</button>
                </div>
                <div class="vertex-dialog-fields">
                    <label for="vertex-start">Začiatočný vrchol</label>
                    <input id="vertex-start" name="start" type="number" min="1" step="1" placeholder="Číslo vrcholu" required aria-describedby="vertex-error">
                    <label for="vertex-end">Koncový vrchol</label>
                    <input id="vertex-end" name="end" type="number" min="1" step="1" placeholder="Číslo vrcholu" required aria-describedby="vertex-error">
                    <p id="vertex-error" class="vertex-error" role="alert" hidden></p>
                </div>
                <div class="vertex-dialog-actions">
                    <button type="button" id="vertex-dialog-cancel" class="vertex-button vertex-button-secondary">Zrušiť</button>
                    <button type="submit" id="vertex-dialog-submit" class="vertex-button vertex-button-primary">Vypočítať</button>
                </div>
            </form>
        </dialog>
        <dialog id="update-dialog" class="vertex-dialog" aria-labelledby="update-dialog-title">
            <form id="update-form" class="vertex-form" novalidate>
                <div class="vertex-dialog-heading">
                    <div>
                        <p class="vertex-dialog-kicker">AKTUALIZÁCIA GRAFU</p>
                        <h2 id="update-dialog-title">Aktualizácia vrcholu</h2>
                    </div>
                    <button type="button" id="update-dialog-close" class="vertex-dialog-close" aria-label="Zavrieť">&times;</button>
                </div>
                <div id="update-mode-fields" class="vertex-dialog-fields">
                    <p>Vyberte, ktoré hrany chcete zadať:</p>
                    <button type="button" id="update-all-edges" class="vertex-button vertex-button-primary">Zadať všetky hrany</button>
                    <button type="button" id="update-some-edges" class="vertex-button vertex-button-primary">Zadať iba niektoré hrany</button>
                </div>
                <div id="update-entry-fields" class="vertex-dialog-fields" hidden>
                    <label for="update-vertex">Aktualizovaný vrchol</label>
                    <input id="update-vertex" type="number" min="1" step="1" placeholder="Číslo vrcholu" required>
                    <div id="update-all-inputs" class="vertex-dialog-fields" hidden>
                        <label for="update-outgoing">Hrany vychádzajúce z vrcholu</label>
                        <input id="update-outgoing" type="text" placeholder="Váhy hrán do vrcholov v poradí">
                        <label for="update-incoming">Hrany vchádzajúce do vrcholu</label>
                        <input id="update-incoming" type="text" placeholder="Váhy hrán zo vrcholov v poradí">
                    </div>
                    <div id="update-some-inputs" class="vertex-dialog-fields" hidden>
                        <label for="update-targets">Cieľové vrcholy vo formáte vrchol1:váha1,vrchol2:váha2</label>
                        <input id="update-targets" type="text" placeholder="vrchol1:váha1,vrchol2:váha2">
                        <label for="update-sources">Zdrojové vrcholy vo formáte vrchol1:váha1,vrchol2:váha2</label>
                        <input id="update-sources" type="text" placeholder="vrchol1:váha1,vrchol2:váha2">
                    </div>
                    <p id="update-error" class="vertex-error" role="alert" hidden></p>
                </div>
                <div id="update-dialog-actions" class="vertex-dialog-actions" hidden>
                    <button type="button" id="update-dialog-back" class="vertex-button vertex-button-secondary">Späť</button>
                    <button type="button" id="update-dialog-cancel" class="vertex-button vertex-button-secondary">Zrušiť</button>
                    <button type="submit" id="update-dialog-submit" class="vertex-button vertex-button-primary">Aktualizovať</button>
                </div>
            </form>
        </dialog>
    </div>
    <script type="module" src="./main.js"></script>
    <div class="side-panel" id="panel" style="display: none;">
        <label><input type="radio" name="mode1" value="L"> Najkratšie cesty</label>
        <label><input type="radio" name="mode1" value="NonL"> Lokálne najkratšie cesty</label>
    </div>
    <div id="color-square-panel" class="color-square-panel" aria-label="Farby"></div>
    <aside class="side-panel update-side-panel"  aria-label="Aktualizácie">
        <h2 class="workspace-label">funkcie</h2>
        <div id="update-app"></div>
    </aside>
</body>
</html>
